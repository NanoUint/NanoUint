<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steins;Gate X — 流程图脚本编辑器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Microsoft YaHei',sans-serif; background:#1a1a1a; color:#d4d4d4; display:flex; height:100vh; overflow:hidden; }

.palette { width:180px; background:#222; border-right:1px solid #333; display:flex; flex-direction:column; flex-shrink:0; }
.palette h3 { padding:12px; font-size:13px; color:#888; border-bottom:1px solid #333; }
.palette-list { flex:1; overflow-y:auto; padding:6px; }
.palette-item { padding:8px 10px; margin:2px 0; border-radius:4px; cursor:grab; font-size:12px; color:#ccc; border:1px solid transparent; transition:all 0.15s; }
.palette-item:hover { border-color:#555; background:#2a2a2a; }
.palette-item:active { cursor:grabbing; opacity:0.7; }

.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.toolbar { padding:6px 12px; background:#252526; border-bottom:1px solid #333; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.toolbar button { padding:5px 12px; border:1px solid #444; background:#333; color:#ccc; border-radius:3px; cursor:pointer; font-size:12px; }
.toolbar button:hover { background:#444; }
.toolbar button.primary { background:#0e639c; border-color:#0e639c; color:#fff; }
.toolbar button.success { background:#1a6b3a; border-color:#1a6b3a; color:#fff; }
.toolbar .sep { width:1px; height:20px; background:#444; margin:0 4px; }
.toolbar .fname { font-weight:bold; color:#fff; font-size:13px; margin-left:8px; }

.canvas-wrap { flex:1; position:relative; overflow:auto; background:#1a1a1a;
  background-image: radial-gradient(circle, #252525 1px, transparent 1px);
  background-size: 24px 24px; }
.canvas-inner { position:relative; width:4000px; height:4000px; }
svg.connections { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }
svg.connections path { fill:none; stroke:#4a9; stroke-width:2; marker-end:url(#arrow); }
svg.connections path.selected { stroke:#fa4; stroke-width:3; }

.node { position:absolute; min-width:140px; background:#252526; border:2px solid #444; border-radius:6px; cursor:move; z-index:2; user-select:none; }
.node.selected { border-color:#4a9; box-shadow:0 0 12px rgba(68,170,153,0.3); }
.node.start { border-color:#6a6; background:#1a2a1a; }
.node.say { border-color:#48a; }
.node.narration { border-color:#48a; }
.node.bg { border-color:#8a4; }
.node.sprite { border-color:#8a4; }
.node.bgm { border-color:#a4a; }
.node.sfx { border-color:#a4a; }
.node.voice { border-color:#a4a; }
.node.choice { border-color:#c84; }
.node.jump { border-color:#c84; }
.node.if_flag { border-color:#c84; }
.node.label { border-color:#c84; }
.node.wait { border-color:#888; }
.node.phone { border-color:#cc6; }
.node.sys { border-color:#888; }
.node.end { border-color:#c44; background:#2a1a1a; }
.node-header { padding:4px 8px; font-size:11px; font-weight:bold; border-radius:4px 4px 0 0; display:flex; align-items:center; gap:4px; }
.node-body { padding:4px 8px 6px; font-size:11px; color:#aaa; line-height:1.4; max-width:200px; word-break:break-all; }
.port { width:10px; height:10px; background:#4a9; border-radius:50%; position:absolute; z-index:3; cursor:crosshair; }
.port.in { top:-5px; left:50%; margin-left:-5px; }
.port.out { bottom:-5px; left:50%; margin-left:-5px; }
.port:hover { background:#6c6; transform:scale(1.4); }

.properties { width:240px; background:#222; border-left:1px solid #333; display:flex; flex-direction:column; flex-shrink:0; overflow-y:auto; }
.properties h3 { padding:12px; font-size:13px; color:#888; border-bottom:1px solid #333; }
.prop-body { padding:10px; }
.prop-body label { display:block; font-size:11px; color:#888; margin:8px 0 3px; }
.prop-body input, .prop-body textarea, .prop-body select { width:100%; padding:5px 7px; background:#1a1a1a; color:#ddd; border:1px solid #444; border-radius:3px; font-size:11px; font-family:inherit; }
.prop-body textarea { min-height:60px; resize:vertical; }
.prop-body button { width:100%; padding:6px; margin-top:8px; background:#a33; color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:11px; }
.prop-body button:hover { background:#c44; }

.statusbar { padding:4px 12px; background:#007acc; color:#fff; font-size:11px; display:flex; justify-content:space-between; flex-shrink:0; }

.gen-output { display:none; position:fixed; top:10%; left:10%; right:10%; bottom:10%; background:#1e1e1e; border:1px solid #555; border-radius:8px; z-index:100; flex-direction:column; }
.gen-output.show { display:flex; }
.gen-output .header { padding:10px 16px; border-bottom:1px solid #333; display:flex; align-items:center; justify-content:space-between; }
.gen-output .header button { padding:4px 12px; background:#333; color:#ccc; border:1px solid #555; border-radius:3px; cursor:pointer; }
.gen-output textarea { flex:1; margin:0; background:#111; color:#ddd; border:none; padding:12px; font-family:'Consolas',monospace; font-size:13px; resize:none; }
</style>
</head>
<body>

<div class="palette">
  <h3>🧩 节点面板 — 拖到画布</h3>
  <div class="palette-list" id="paletteList"></div>
</div>

<div class="main">
  <div class="toolbar">
    <button onclick="saveFile()" class="primary">💾 保存</button>
    <button onclick="reloadScript()" class="success">🔄 热重载</button>
    <span class="sep"></span>
    <button onclick="showGenerated()">📄 查看.vns</button>
    <button onclick="clearCanvas()">🗑 清空</button>
    <span class="sep"></span>
    <span class="fname" id="currentFile">未选择文件</span>
    <span style="flex:1"></span>
    <button onclick="loadFileList()">📁 刷新文件</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-inner" id="canvasInner">
      <svg class="connections" id="svgConnections"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4a9"/></marker></defs></svg>
    </div>
  </div>

  <div class="statusbar">
    <span id="statusText">就绪 — 从左侧拖动节点到画布开始编写剧情</span>
    <span id="statusInfo">节点: 0 | 连接: 0</span>
  </div>
</div>

<div class="properties" id="propPanel">
  <h3>⚙ 属性编辑</h3>
  <div class="prop-body" id="propBody">
    <p style="font-size:11px;color:#666;">点击画布上的节点查看属性</p>
  </div>
</div>

<div class="gen-output" id="genOutput">
  <div class="header"><span>生成的 .vns 代码</span>
    <div><button onclick="copyGenerated()">📋 复制</button>
    <button onclick="document.getElementById('genOutput').classList.remove('show')">✕ 关闭</button></div>
  </div>
  <textarea id="genTextarea" readonly></textarea>
</div>

<script>
// ==================== 节点类型定义 ====================
const NODE_TYPES = [
  { type:'start',  label:'🚀 开始',      color:'#6a6', defaults:{}, isStart:true },
  { type:'say',    label:'💬 角色对话',   color:'#48a', defaults:{speaker:'零', text:'你好。'} },
  { type:'narration', label:'📖 旁白',   color:'#48a', defaults:{text:'夜幕降临。'} },
  { type:'colon',  label:'📖 : 文本',    color:'#48a', defaults:{text:'叙述文本...'} },
  { type:'bg',     label:'🖼️ 背景',      color:'#8a4', defaults:{path:'BG01A.png'} },
  { type:'sprite', label:'👤 立绘',      color:'#8a4', defaults:{path:'kurisu_normal.png', pos:'center'} },
  { type:'bgm',    label:'🎵 BGM',       color:'#a4a', defaults:{path:'bgm03.ogg'} },
  { type:'sfx',    label:'🔔 音效',      color:'#a4a', defaults:{path:'sgse001.ogg'} },
  { type:'voice',  label:'🎤 语音',      color:'#a4a', defaults:{path:'voice_kurisu_01.ogg'} },
  { type:'choice', label:'❓ 选择分支',   color:'#c84', defaults:{options:[{text:'选项A',target:'label_a'},{text:'选项B',target:'label_b'}]} },
  { type:'option', label:'  ↳ 选项',     color:'#da4', defaults:{text:'选项...', target:'label'} },
  { type:'jump',   label:'↗️ 跳转',      color:'#c84', defaults:{target:'label_name'} },
  { type:'label',  label:'🏷️ 标签',      color:'#c84', defaults:{name:'scene_start'} },
  { type:'if_flag',label:'🔀 条件判断',  color:'#c84', defaults:{flag:'met_rei'} },
  { type:'wait',   label:'⏱️ 等待',      color:'#888', defaults:{seconds:1} },
  { type:'set_flag',label:'🚩 设置标记', color:'#c84', defaults:{name:'flag_name',value:true} },
  { type:'phone_msg',label:'📱 手机消息',color:'#cc6', defaults:{sender:'零', text:'你在哪？'} },
  { type:'phone_call',label:'📞 来电',   color:'#cc6', defaults:{caller:'零'} },
  { type:'sys_msg',label:'🪟 系统弹窗',  color:'#888', defaults:{title:'提示', text:'...'} },
  { type:'end',    label:'⏹️ 结束',      color:'#c44', defaults:{}, isEnd:true },
];

// ==================== 渲染节点面板 ====================
const paletteList = document.getElementById('paletteList');
NODE_TYPES.forEach(nt => {
  const div = document.createElement('div');
  div.className = 'palette-item';
  div.style.borderLeftColor = nt.color;
  div.style.borderLeftWidth = '3px';
  div.textContent = nt.label;
  div.draggable = true;
  div.addEventListener('dragstart', e => {
    e.dataTransfer.setData('nodeType', nt.type);
    e.dataTransfer.effectAllowed = 'copy';
  });
  paletteList.appendChild(div);
});

// ==================== 画布状态 ====================
let nodes = [], nextId = 1, selectedNodeId = null, connectingFrom = null;
let currentFileName = null;
const canvasWrap = document.getElementById('canvasWrap');
const canvasInner = document.getElementById('canvasInner');
const svg = document.getElementById('svgConnections');

// ==================== 放置节点 ====================
canvasWrap.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
canvasWrap.addEventListener('drop', e => {
  e.preventDefault();
  const nodeType = e.dataTransfer.getData('nodeType');
  if (!nodeType) return;
  const rect = canvasInner.getBoundingClientRect();
  const x = e.clientX - rect.left + canvasWrap.scrollLeft;
  const y = e.clientY - rect.top + canvasWrap.scrollTop;
  addNode(nodeType, x, y);
});

function addNode(type, x, y) {
  const nt = NODE_TYPES.find(t => t.type === type);
  if (!nt) return;
  const node = { id:nextId++, type, x, y, props:{...nt.defaults}, next:null };
  if (nt.isStart) node.props._start = true;
  if (nt.isEnd) node.props._end = true;
  nodes.push(node);
  renderAll();
  selectNode(node.id);
}

// ==================== 渲染 ====================
function renderAll() {
  canvasInner.querySelectorAll('.node').forEach(el => el.remove());
  nodes.forEach(n => {
    const nt = NODE_TYPES.find(t => t.type === n.type);
    const el = document.createElement('div');
    el.className = `node ${n.type}${n.id===selectedNodeId?' selected':''}`;
    el.style.left = n.x+'px'; el.style.top = n.y+'px';
    el.dataset.id = n.id;
    el.innerHTML = `<div class="node-header" style="color:${nt?.color||'#ccc'}">${nt?.label||n.type}</div>
      <div class="node-body">${summarizeNode(n)}</div>
      <div class="port in" data-port="in"></div><div class="port out" data-port="out"></div>`;
    el.addEventListener('mousedown', e => onNodeMouseDown(e, n.id));
    el.querySelector('.port.out').addEventListener('mousedown', e => { e.stopPropagation(); connectingFrom = n.id; });
    el.querySelector('.port.in').addEventListener('mouseup', e => {
      e.stopPropagation();
      if (connectingFrom !== null && connectingFrom !== n.id) {
        const fromNode = nodes.find(x => x.id === connectingFrom);
        if (fromNode) { fromNode.next = n.id; renderConnections(); updateStatus(); }
      }
      connectingFrom = null;
    });
    canvasInner.appendChild(el);
  });
  renderConnections();
  updateStatus();
}

function summarizeNode(n) {
  const p = n.props;
  switch(n.type) {
    case 'say': return `${p.speaker}: "${trunc(p.text,30)}"`;
    case 'narration': case 'colon': return `"${trunc(p.text,40)}"`;
    case 'bg': case 'bgm': case 'sfx': case 'voice': return p.path || '';
    case 'sprite': return `${p.path || ''} [${p.pos||'center'}]`;
    case 'choice': return `${(p.options||[]).length} 个选项`;
    case 'jump': return `→ #${p.target||''}`;
    case 'label': return `#${p.name||''}`;
    case 'if_flag': return `flag.${p.flag||''}`;
    case 'wait': return `${p.seconds||1}秒`;
    case 'set_flag': return `${p.name||''}=${p.value?'true':'false'}`;
    case 'phone_msg': return `${p.sender}: ${trunc(p.text,20)}`;
    case 'phone_call': return `来电: ${p.caller||''}`;
    case 'sys_msg': return `${p.title}: ${trunc(p.text,20)}`;
    default: return '';
  }
}
function trunc(s, len) { return s && s.length > len ? s.substring(0,len)+'...' : (s||''); }

function renderConnections() {
  svg.querySelectorAll('path').forEach(p => p.remove());
  nodes.forEach(n => {
    if (n.next) {
      const to = nodes.find(x => x.id === n.next);
      if (!to) return;
      const sx = n.x + 70, sy = n.y + 60;
      const tx = to.x + 70, ty = to.y;
      const midY = (sy + ty) / 2;
      const d = `M${sx},${sy} C${sx},${midY} ${tx},${midY} ${tx},${ty}`;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', d);
      path.setAttribute('class', n.id === selectedNodeId ? 'selected' : '');
      svg.appendChild(path);
    }
  });
}

function updateStatus() {
  const connCount = nodes.filter(n => n.next).length;
  document.getElementById('statusInfo').textContent = `节点: ${nodes.length} | 连接: ${connCount}`;
}

// ==================== 拖拽节点 ====================
let dragId = null, dragStartX, dragStartY, nodeStartX, nodeStartY;
function onNodeMouseDown(e, id) {
  if (e.target.classList.contains('port')) return;
  e.preventDefault();
  selectNode(id);
  dragId = id;
  dragStartX = e.clientX; dragStartY = e.clientY;
  const n = nodes.find(x => x.id === id);
  nodeStartX = n.x; nodeStartY = n.y;
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}
function onDragMove(e) {
  if (!dragId) return;
  const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
  const n = nodes.find(x => x.id === dragId);
  n.x = nodeStartX + dx; n.y = nodeStartY + dy;
  renderAll();
}
function onDragEnd() {
  dragId = null;
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
}

canvasWrap.addEventListener('mouseup', () => { if (connectingFrom) { connectingFrom = null; } });

// ==================== 属性面板 ====================
function selectNode(id) {
  selectedNodeId = id;
  renderAll();
  const n = nodes.find(x => x.id === id);
  if (!n) { document.getElementById('propBody').innerHTML = '<p style="font-size:11px;color:#666;">点击节点查看属性</p>'; return; }
  const nt = NODE_TYPES.find(t => t.type === n.type);
  let html = `<p style="font-size:11px;color:${nt?.color||'#888'};font-weight:bold;margin-bottom:8px;">${nt?.label||n.type}</p>`;
  if (n.type === 'say') {
    html += `<label>说话人</label><input value="${h(n.props.speaker)}" onchange="updateProp(${id},'speaker',this.value)">`;
    html += `<label>文本</label><textarea onchange="updateProp(${id},'text',this.value)">${h(n.props.text)}</textarea>`;
  } else if (n.type === 'narration' || n.type === 'colon') {
    html += `<label>文本</label><textarea onchange="updateProp(${id},'text',this.value)">${h(n.props.text)}</textarea>`;
  } else if (n.type === 'bg' || n.type === 'bgm' || n.type === 'sfx' || n.type === 'voice') {
    html += `<label>文件路径</label><input value="${h(n.props.path)}" onchange="updateProp(${id},'path',this.value)">`;
  } else if (n.type === 'sprite') {
    html += `<label>文件路径</label><input value="${h(n.props.path)}" onchange="updateProp(${id},'path',this.value)">`;
    html += `<label>位置</label><select onchange="updateProp(${id},'pos',this.value)"><option value="center" ${n.props.pos==='center'?'selected':''}>居中</option><option value="left" ${n.props.pos==='left'?'selected':''}>左</option><option value="right" ${n.props.pos==='right'?'selected':''}>右</option></select>`;
  } else if (n.type === 'label') {
    html += `<label>标签名</label><input value="${h(n.props.name)}" onchange="updateProp(${id},'name',this.value)">`;
  } else if (n.type === 'jump') {
    html += `<label>目标标签</label><input value="${h(n.props.target)}" onchange="updateProp(${id},'target',this.value)">`;
  } else if (n.type === 'choice') {
    html += `<label>选项列表（每行一个: 文本→标签）</label><textarea onchange="updateChoiceOptions(${id},this.value)">${(n.props.options||[]).map(o=>o.text+' → '+o.target).join('\n')}</textarea>`;
  } else if (n.type === 'option') {
    html += `<label>文本</label><input value="${h(n.props.text)}" onchange="updateProp(${id},'text',this.value)">`;
    html += `<label>目标标签</label><input value="${h(n.props.target)}" onchange="updateProp(${id},'target',this.value)">`;
  } else if (n.type === 'if_flag') {
    html += `<label>标记名</label><input value="${h(n.props.flag)}" onchange="updateProp(${id},'flag',this.value)">`;
  } else if (n.type === 'wait') {
    html += `<label>秒数</label><input type="number" value="${n.props.seconds||1}" step="0.5" min="0.1" onchange="updateProp(${id},'seconds',parseFloat(this.value))">`;
  } else if (n.type === 'set_flag') {
    html += `<label>标记名</label><input value="${h(n.props.name)}" onchange="updateProp(${id},'name',this.value)">`;
    html += `<label>值</label><select onchange="updateProp(${id},'value',this.value==='true')"><option value="true" ${n.props.value?'selected':''}>true</option><option value="false" ${!n.props.value?'selected':''}>false</option></select>`;
  } else if (n.type === 'phone_msg') {
    html += `<label>发送者</label><input value="${h(n.props.sender)}" onchange="updateProp(${id},'sender',this.value)">`;
    html += `<label>内容</label><textarea onchange="updateProp(${id},'text',this.value)">${h(n.props.text)}</textarea>`;
  } else if (n.type === 'phone_call') {
    html += `<label>来电者</label><input value="${h(n.props.caller)}" onchange="updateProp(${id},'caller',this.value)">`;
  } else if (n.type === 'sys_msg') {
    html += `<label>标题</label><input value="${h(n.props.title)}" onchange="updateProp(${id},'title',this.value)">`;
    html += `<label>内容</label><textarea onchange="updateProp(${id},'text',this.value)">${h(n.props.text)}</textarea>`;
  }
  html += `<button onclick="deleteNode(${id})">🗑 删除此节点</button>`;
  document.getElementById('propBody').innerHTML = html;
}

function h(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function updateProp(id, key, value) { const n = nodes.find(x => x.id === id); if (n) { n.props[key] = value; renderAll(); } }
function updateChoiceOptions(id, text) {
  const opts = text.split('\n').filter(l=>l.trim()).map(l=>{ const p=l.split('→'); return {text:(p[0]||'').trim(), target:(p[1]||'').trim()}; });
  const n = nodes.find(x => x.id === id); if (n) n.props.options = opts;
}
function deleteNode(id) { nodes = nodes.filter(n => n.id !== id); nodes.forEach(n => { if (n.next === id) n.next = null; }); selectedNodeId = null; renderAll(); document.getElementById('propBody').innerHTML = '<p style="font-size:11px;color:#666;">点击节点查看属性</p>'; }

// ==================== 生成 .vns ====================
function generateVns() {
  const startNode = nodes.find(n => n.type === 'start');
  if (!startNode) return '@@outline("新章节")\n; 请先添加一个"开始"节点\n';
  let code = '@@outline("新章节")\n';
  const visited = new Set();
  let current = startNode;
  while (current && !visited.has(current.id)) {
    visited.add(current.id);
    code += nodeToVns(current) + '\n';
    current = current.next ? nodes.find(n => n.id === current.next) : null;
  }
  return code;
}

function nodeToVns(n) {
  const p = n.props;
  switch(n.type) {
    case 'start': return '; === 开始 ===';
    case 'say': return `@say("${p.speaker}", "${p.text}")`;
    case 'narration': return `@narration("${p.text}")`;
    case 'colon': return `: "${p.text}"`;
    case 'bg': return `@bg("${p.path}")`;
    case 'sprite': return `@sprite("${p.path}", pos: "${p.pos||'center'}")`;
    case 'bgm': return `@bgm("${p.path}")`;
    case 'sfx': return `@sfx("${p.path}")`;
    case 'voice': return `@voice("${p.path}")`;
    case 'label': return `#${p.name}`;
    case 'jump': return `@jump(#${p.target})`;
    case 'choice':
      let c = '@choice()\n';
      (p.options||[]).forEach(o => c += `    - "${o.text}" -> #${o.target}\n`);
      c += '@end';
      return c;
    case 'option': return `    - "${p.text}" -> #${p.target}`;
    case 'if_flag': return `@if(flag.${p.flag})\n    ; ...\n@else\n    ; ...\n@end`;
    case 'wait': return `@wait(${p.seconds||1})`;
    case 'set_flag': return `@set_flag("${p.name}", ${p.value?'true':'false'})`;
    case 'phone_msg': return `@phone_message("${p.sender}", "${p.text}")`;
    case 'phone_call': return `@phone_call("${p.caller}")`;
    case 'sys_msg': return `@sys_message("${p.text}", title: "${p.title}")`;
    case 'end': return '; === 结束 ===';
    default: return '';
  }
}

function showGenerated() {
  document.getElementById('genTextarea').value = generateVns();
  document.getElementById('genOutput').classList.add('show');
}
function copyGenerated() {
  document.getElementById('genTextarea').select();
  document.execCommand('copy');
  setStatus('已复制到剪贴板');
}

function clearCanvas() {
  if (!confirm('确定清空所有节点？')) return;
  nodes = []; nextId = 1; selectedNodeId = null;
  renderAll();
  document.getElementById('propBody').innerHTML = '<p style="font-size:11px;color:#666;">点击节点查看属性</p>';
}

// ==================== 文件操作 ====================
async function loadFileList() {
  try { const res = await fetch('/api/scripts'); const files = await res.json();
    const html = files.map((f,i) => `<div class="file-item${f.name===currentFileName?' active':''}" onclick="selectFile(${i})" style="padding:6px 10px;cursor:pointer;font-size:12px;">📄 ${f.name}</div>`).join('');
    const fl = document.querySelector('.palette-list');
    fl.innerHTML = '<h3 style="padding:8px;font-size:12px;color:#888;">📁 脚本文件</h3>' + html + '<div style="margin-top:8px;border-top:1px solid #333;padding-top:8px;"></div>';
    NODE_TYPES.forEach(nt => {
      const div = document.createElement('div');
      div.className = 'palette-item';
      div.style.borderLeftColor = nt.color; div.style.borderLeftWidth = '3px';
      div.textContent = nt.label; div.draggable = true;
      div.addEventListener('dragstart', e => { e.dataTransfer.setData('nodeType', nt.type); });
      fl.appendChild(div);
    });
  } catch(e) { setStatus('加载文件列表失败', true); }
}

async function selectFile(index) {
  try { const res = await fetch('/api/scripts'); const files = await res.json();
    const file = files[index]; if (!file) return;
    const r2 = await fetch('/api/scripts/' + file.name); const data = await r2.json();
    currentFileName = file.name; document.getElementById('currentFile').textContent = '📝 ' + file.name;
    if (data.flowJson) { loadFromJson(JSON.parse(data.flowJson)); setStatus('已加载流程图: ' + file.name); }
    else if (data.content && data.content.includes('@')) { setStatus('文本脚本已加载（需手动转换为流程图）'); }
    else { clearCanvas(); addNode('start', 100, 50); setStatus('新脚本'); }
  } catch(e) { setStatus('加载失败', true); }
}

function loadFromJson(json) {
  nodes = json.nodes || []; nextId = (json.nextId || 1); selectedNodeId = null;
  renderAll(); setStatus('流程图已加载');
}

async function saveFile() {
  if (!currentFileName) { currentFileName = prompt('文件名:', 'new_script.vns'); if (!currentFileName) return; }
  const vnsCode = generateVns();
  const flowJson = JSON.stringify({ nodes, nextId });
  try {
    const res = await fetch('/api/scripts/' + currentFileName, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ content: vnsCode, blocklyJson: flowJson })
    });
    if ((await res.json()).ok) { setStatus('✅ 已保存: ' + currentFileName); loadFileList(); }
  } catch(e) { setStatus('保存失败', true); }
}

async function reloadScript() {
  const body = currentFileName ? JSON.stringify({file:currentFileName}) : '{}';
  try { await fetch('/api/reload', { method:'POST', headers:{'Content-Type':'application/json'}, body });
    setStatus('🔄 热重载成功'); } catch(e) { setStatus('热重载失败', true); }
}

function setStatus(msg, isErr) {
  document.getElementById('statusText').textContent = msg;
  if (isErr) document.querySelector('.statusbar').style.background = '#a33';
  else { document.querySelector('.statusbar').style.background = '#007acc'; setTimeout(() => {}, 3000); }
}
